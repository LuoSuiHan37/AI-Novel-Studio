id: western_fantasy
name: 西方奇幻
genres:
  - 西方奇幻
  - 聚落建设
  - 荒野冒险
default_platform: fanqie
subtype: 聚落建设与荒野遗迹探索
tropes:
  - 资源经营
  - 荒野生存
  - 古代遗迹
writing_rules:
  - 通过资源、地形、工具和身体代价推进，不用连续解释世界观。
  - 主角必须在行动中做选择，选择要改变资源、关系或风险。
  - 探索、建设、战斗和人物关系轮换，不能连续使用同一种危机。
  - 核心意象可以回返，但每次必须承担不同叙事功能。
behavior_rotation:
  - 测量或观察环境
  - 资源分配与建设
  - 独立探索
  - 盟友协作
  - 失败后改变方案
reveal_policy:
  - 单章最多揭示一个遗迹机制或世界规则。
  - 新发现必须带来行动选择或资源代价。
  - 危险升级后先写生存后果，不立即连续揭示更大的怪物或阴谋。
anti_template_rules:
  - 不连续使用“异象亮起—主角靠近—巨大生物苏醒—逃亡”结构。
  - 不让蓝光、心跳、刻纹等核心意象在每段都承担同一功能。
phase_rules:
  exploration:
    - 至少保留一个无法立即解释的现象。
    - 环境必须改变行动路线，而不是只提供氛围。
  settlement:
    - 每次建设都要消耗资源并改变聚落关系。
