id: palace_house
name: 古代宅斗
subtype: 宅斗经营与家族旧案
genres:
  - 古代言情
  - 宅斗
default_platform: qidian
tropes:
  - 中馈争夺
  - 婆媳与族权
  - 旧案翻查
writing_rules:
  - 让账目、物件和礼法成为行动工具，而不是背景说明。
  - 女主的专业判断必须有证据边界，不能连续每章都完全正确。
  - 族权、婆母、夫妇合作和旧案线要逐步升级，不能一章同时揭穿全部幕后关系。
  - 女主必须允许出现信息不足、误判或暂时失败，不能连续章节全知全能。
  - 账目线要通过物证、流程、证人和利益关系推进，不能只靠女主讲解结论。
  - 夫妇关系只能通过合作边界、利益交换和代价变化推进。
behavior_rotation:
  - 女主独立查账
  - 女主被制度或长辈限制
  - 对手留下误导性证据
  - 世子提供有限帮助
  - 女主判断失误后修正策略
reveal_policy:
  - 单章最多揭示一个家族旧案核心事实
  - 新证据必须带来新行动，不得只增加背景说明
  - 母亲旧案、族权和中馈线不能在同一章全部完成解释
anti_template_rules:
  - 不连续使用“发现账目异常—女主精准拆解—对手立即供出幕后人”结构
  - 结尾轮换证据、制度压力、人物选择和行动后果
phase_rules:
  investigation:
    - 至少保留一条无法立即验证的证据
    - 线索必须经过两个不同来源才能升级为事实
  power_struggle:
    - 女主每次赢得局部优势都要付出关系或资源代价
continuity_signals: []
