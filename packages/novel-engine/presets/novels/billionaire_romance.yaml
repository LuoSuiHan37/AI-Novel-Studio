id: billionaire_romance
name: 豪门总裁
subtype: 契约婚姻与豪门悬疑
genres:
  - 豪门总裁
  - 都市言情
default_platform: qimao
tropes:
  - 契约婚姻
  - 家族秘密
  - 身份与利益冲突
writing_rules:
  - 关系推进必须通过选择、信任和代价发生，不能只靠保护或暧昧台词。
  - 男主不能连续章节都承担救场和信息掌控功能。
  - 外部威胁、商业冲突和感情冲突要轮换，不连续重复同一种压力。
  - 主角主动权必须轮换，男主不能连续两章同时承担救场、隐瞒和解释功能。
  - 感情推进必须产生可见代价，不能用一句“我是为了保护你”替代关系变化。
  - 商业线优先使用合同、股权、会议记录、资金流和实际决策推进。
behavior_rotation:
  - 女主主动调查
  - 男主被迫回应
  - 第三方制造利益冲突
  - 女主做出错误判断并承担代价
  - 双方暂时结盟
reveal_policy:
  - 单章最多揭示一个二级秘密和两个新证据
  - 一级家族真相揭示后必须先写后果，不能立即连续解释
  - 同一秘密不得连续由男主直接口述
anti_template_rules:
  - 连续两章不得重复“男主保护女主—女主质问—男主隐瞒”结构
  - 章节结尾轮换决定、证据、关系变化和现实后果，不连续使用身份反转
phase_rules:
  investigation:
    - 证据必须存在冲突，女主不能每次一次判断正确
    - 每章只解决一个局部问题
  relationship_reversal:
    - 关系变化必须由选择或代价触发
continuity_signals: []
