id: workplace_romance
name: 职场婚恋
subtype: 职业压力与情感选择
genres:
  - 职场婚恋
  - 都市言情
default_platform: fanqie
tropes:
  - 契约关系
  - 职场成长
  - 误会与和解
  - 权力反转
  - 隐藏真相
writing_rules:
  - 职业冲突与感情冲突交替推进，不能连续依靠暧昧或争吵制造进展。
  - 主角必须通过选择、证据和实际代价改变关系与职场处境。
  - 商业线优先使用合同、会议记录、流程、资金和职责推进，避免空泛的职场旁白。
  - 每次关系靠近或疏远都要改变至少一项信任、信息或权力状态。
  - 男女性主角的主动权要轮换，不能长期由同一方掌握所有信息和决策。
behavior_rotation:
  - 主角调查事实
  - 对方施加情感或职业压力
  - 第三方制造利益冲突
  - 主角作出取舍并承担代价
  - 双方暂时结盟
reveal_policy:
  - 单章最多揭示一个核心秘密和两个新证据。
  - 重要真相揭示后必须先写现实后果，再推进下一层解释。
  - 同一秘密不得连续由同一角色直接口述揭示。
anti_template_rules:
  - 不连续重复“误会—争吵—保护—和好”的章节结构。
  - 章节结尾轮换使用决定、证据、关系变化和现实后果，不连续依赖身份反转。
phase_rules:
  investigation:
    - 证据必须存在冲突，主角不能每次都一次判断正确。
    - 每章只解决一个局部问题，并留下新的行动压力。
  relationship_reversal:
    - 关系变化必须由选择、证据或代价触发。
continuity_signals: []
