[project]
name = "ai-novel-engine"
version = "0.1.0"
description = "Domain engine for ai-novel-studio (agents, memory, workflows)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
